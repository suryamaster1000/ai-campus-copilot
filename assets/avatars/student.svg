<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d5e3ff"/>
      <stop offset="100%" stop-color="#adc7ff"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="40" cy="40" r="40"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <rect width="80" height="80" fill="url(#bgGrad)"/>
    <!-- Navy Sweater -->
    <path d="M12 80 C12 62, 24 54, 40 54 C56 54, 68 62, 68 80 Z" fill="#1b2a4a"/>
    <!-- Shirt Collar -->
    <polygon points="40,59 33,52 47,52" fill="#ffffff"/>
    <polygon points="40,64 35,53 45,53" fill="#005bbf"/>
    <!-- Neck -->
    <rect x="35" y="44" width="10" height="12" fill="#f5cfa7"/>
    <!-- Head -->
    <ellipse cx="40" cy="36" rx="14" ry="16" fill="#f5cfa7"/>
    <!-- Hair -->
    <path d="M26 34 C26 20, 31 16, 40 16 C49 16, 54 20, 54 34 C54 38, 52 43, 52 45 C49 39, 48 30, 40 30 C32 30, 31 39, 28 45 C28 43, 26 38, 26 34 Z" fill="#1e1b18"/>
    <!-- Glasses -->
    <rect x="29" y="32" width="9" height="7" rx="2" fill="none" stroke="#222" stroke-width="1.5"/>
    <rect x="42" y="32" width="9" height="7" rx="2" fill="none" stroke="#222" stroke-width="1.5"/>
    <line x1="38" y1="35" x2="42" y2="35" stroke="#222" stroke-width="1.5"/>
    <!-- Eyes -->
    <circle cx="33.5" cy="35.5" r="1.2" fill="#222"/>
    <circle cx="46.5" cy="35.5" r="1.2" fill="#222"/>
    <!-- Smile -->
    <path d="M36 44 Q40 47 44 44" fill="none" stroke="#d48a60" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
