<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — AI Campus Copilot</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif']
          },
          colors: {
            primary: "#005bbf",
            "primary-container": "#1a73e8",
            "on-primary": "#ffffff",
            "on-primary-container": "#ffffff",
            "surface": "#f7f9ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f1f4fa",
            "surface-container": "#ebeef4",
            "on-surface": "#181c20",
            "on-surface-variant": "#414754",
            "outline": "#727785",
            "outline-variant": "#c1c6d6",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a",
            "secondary-fixed": "#d5e3ff",
            "on-secondary-fixed": "#001b3b",
            "primary-fixed": "#d8e2ff",
            "on-primary-fixed": "#001a41",
          }
        }
      }
    };
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; display: inline-block; line-height: 1; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.35s ease-out forwards; }
    .input-field { width: 100%; padding: 0.625rem 1rem; background: #f1f4fa; border: 1.5px solid #c1c6d6; border-radius: 0.75rem; font-size: 0.875rem; color: #181c20; outline: none; transition: border-color 0.2s; }
    .input-field:focus { border-color: #005bbf; background: #fff; }
    .btn-primary { width: 100%; padding: 0.75rem; background: #005bbf; color: #fff; font-weight: 700; font-size: 0.875rem; border-radius: 0.75rem; border: none; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary:hover { background: #0052ab; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { background: #c1c6d6; cursor: not-allowed; }
    .btn-google { width: 100%; padding: 0.625rem; background: #fff; border: 1.5px solid #c1c6d6; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 600; color: #181c20; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: background 0.2s, border-color 0.2s; }
    .btn-google:hover { background: #f1f4fa; border-color: #005bbf; }
    .error-msg { color: #ba1a1a; font-size: 0.75rem; padding: 0.5rem 0.75rem; background: #ffdad6; border-radius: 0.5rem; display: none; }
    .error-msg.show { display: block; }
    .divider { display: flex; align-items: center; gap: 0.75rem; color: #727785; font-size: 0.75rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #c1c6d6; }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-50 via-surface to-blue-100 flex items-center justify-center p-4">

  <div class="w-full max-w-sm animate-fade-in">

    <!-- Logo & Branding -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-primary flex items-center justify-center shadow-lg mb-4">
        <img src="assets/logo.svg" alt="Logo" class="w-10 h-10 object-contain filter brightness-200"/>
      </div>
      <h1 class="text-2xl font-extrabold text-on-surface" style="font-family: 'Plus Jakarta Sans', sans-serif;">AI Campus Copilot</h1>
      <p class="text-sm text-on-surface-variant mt-1">Sign in to your student account</p>
    </div>

    <!-- Auth Card -->
    <div class="bg-surface-container-lowest rounded-2xl shadow-xl border border-outline-variant/30 p-6 space-y-4">

      <!-- Tab Switcher -->
      <div class="flex bg-surface-container rounded-xl p-1">
        <button id="tabSignIn" class="flex-1 py-1.5 rounded-lg text-xs font-bold bg-white shadow-sm text-primary transition-all" onclick="switchTab('signin')">Sign In</button>
        <button id="tabSignUp" class="flex-1 py-1.5 rounded-lg text-xs font-bold text-on-surface-variant transition-all" onclick="switchTab('signup')">Create Account</button>
      </div>

      <!-- Error Message -->
      <div class="error-msg" id="authError"></div>

      <!-- SIGN IN FORM -->
      <form id="signInForm" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-on-surface mb-1">Campus Email</label>
          <input id="siEmail" class="input-field" type="email" placeholder="sophia.chen@campus.edu" autocomplete="email" required/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-on-surface mb-1">Password</label>
          <input id="siPassword" class="input-field" type="password" placeholder="••••••••" autocomplete="current-password" required/>
        </div>
        <button type="submit" class="btn-primary mt-1" id="signInBtn">
          Sign In to Dashboard
        </button>
      </form>

      <!-- SIGN UP FORM (Hidden by default) -->
      <form id="signUpForm" class="space-y-3 hidden">
        <div>
          <label class="block text-xs font-semibold text-on-surface mb-1">Full Name</label>
          <input id="suName" class="input-field" type="text" placeholder="Sophia Chen" required/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-on-surface mb-1">Campus Email</label>
          <input id="suEmail" class="input-field" type="email" placeholder="your.name@campus.edu" autocomplete="email" required/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-on-surface mb-1">Password</label>
          <input id="suPassword" class="input-field" type="password" placeholder="Min 6 characters" autocomplete="new-password" required/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-on-surface mb-1">Student Roll Number</label>
          <input id="suRoll" class="input-field" type="text" placeholder="e.g. 24CS0142"/>
        </div>
        <button type="submit" class="btn-primary mt-1" id="signUpBtn">
          Create Account
        </button>
      </form>

      <!-- Divider -->
      <div class="divider text-xs">or continue with</div>

      <!-- Google Sign-In -->
      <button class="btn-google" id="googleSignInBtn" type="button">
        <!-- Google SVG icon -->
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2045c0-.638-.0573-1.2518-.1636-1.8409H9v3.4814h4.8436c-.2086 1.125-.8427 2.0782-1.7959 2.7164v2.2581h2.9086c1.7018-1.5668 2.6836-3.874 2.6836-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.4673-.806 5.9564-2.1818l-2.9086-2.2582c-.8064.54-1.8368.859-3.0477.859-2.344 0-4.3282-1.5836-5.036-3.7109H.9574v2.3318C2.4382 15.9832 5.4818 18 9 18z" fill="#34A853"/>
          <path d="M3.964 10.71c-.18-.54-.2827-1.1168-.2827-1.71s.1018-1.17.2827-1.71V4.9582H.9573C.3477 6.1732 0 7.5482 0 9s.3477 2.8268.9573 4.0418L3.964 10.71z" fill="#FBBC05"/>
          <path d="M9 3.5795c1.3214 0 2.5077.4541 3.4405 1.346l2.5813-2.5814C13.4627.8918 11.4255 0 9 0 5.4818 0 2.4382 2.0168.9573 4.9582L3.964 7.29C4.6718 5.1627 6.6559 3.5795 9 3.5795z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>

      <!-- Info text -->
      <p class="text-center text-[11px] text-on-surface-variant">
        By signing in, you agree to the<br/>
        <span class="text-primary font-semibold">University Academic Data Usage Policy</span>
      </p>
    </div>

    <!-- Footer -->
    <p class="text-center text-[11px] text-on-surface-variant mt-4">
      AI Campus Copilot v2.4 • Powered by Firebase &amp; Gemini
    </p>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="flex flex-col items-center gap-3">
      <span class="material-symbols-outlined text-primary text-[40px] animate-spin">progress_activity</span>
      <span class="text-sm font-semibold text-on-surface" id="loadingText">Signing you in...</span>
    </div>
  </div>

  <script type="module">
    import {
      auth,
      googleProvider,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signInWithPopup,
      onAuthStateChanged,
      db,
      doc,
      setDoc
    } from './js/firebase.js';

    // Auto-redirect if already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = 'index.html';
      }
    });

    function showLoading(text = 'Signing you in...') {
      document.getElementById('loadingOverlay').classList.remove('hidden');
      document.getElementById('loadingText').textContent = text;
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }

    function showError(message) {
      const el = document.getElementById('authError');
      el.textContent = message;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 5000);
    }

    function hideError() {
      document.getElementById('authError').classList.remove('show');
    }

    function friendlyError(code) {
      const map = {
        'auth/invalid-credential': 'Invalid email or password. Please try again.',
        'auth/user-not-found': 'No account found with this email.',
        'auth/wrong-password': 'Incorrect password. Please try again.',
        'auth/email-already-in-use': 'An account already exists with this email.',
        'auth/weak-password': 'Password must be at least 6 characters.',
        'auth/invalid-email': 'Please enter a valid email address.',
        'auth/popup-closed-by-user': 'Google sign-in was cancelled.',
        'auth/network-request-failed': 'Network error. Check your internet connection.',
      };
      return map[code] || 'Something went wrong. Please try again.';
    }

    // Tab switching
    window.switchTab = function(tab) {
      hideError();
      if (tab === 'signin') {
        document.getElementById('signInForm').classList.remove('hidden');
        document.getElementById('signUpForm').classList.add('hidden');
        document.getElementById('tabSignIn').className = 'flex-1 py-1.5 rounded-lg text-xs font-bold bg-white shadow-sm text-primary transition-all';
        document.getElementById('tabSignUp').className = 'flex-1 py-1.5 rounded-lg text-xs font-bold text-on-surface-variant transition-all';
      } else {
        document.getElementById('signInForm').classList.add('hidden');
        document.getElementById('signUpForm').classList.remove('hidden');
        document.getElementById('tabSignIn').className = 'flex-1 py-1.5 rounded-lg text-xs font-bold text-on-surface-variant transition-all';
        document.getElementById('tabSignUp').className = 'flex-1 py-1.5 rounded-lg text-xs font-bold bg-white shadow-sm text-primary transition-all';
      }
    };

    // Email Sign-In
    document.getElementById('signInForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const email = document.getElementById('siEmail').value.trim();
      const password = document.getElementById('siPassword').value;
      if (!email || !password) return;
      showLoading('Signing you in...');
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'index.html';
      } catch (err) {
        hideLoading();
        showError(friendlyError(err.code));
      }
    });

    // Email Sign-Up
    document.getElementById('signUpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const name = document.getElementById('suName').value.trim();
      const email = document.getElementById('suEmail').value.trim();
      const password = document.getElementById('suPassword').value;
      const roll = document.getElementById('suRoll').value.trim();
      if (!name || !email || !password) return;
      showLoading('Creating your account...');
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        // Save user profile in Firestore
        await setDoc(doc(db, 'students', cred.user.uid), {
          name,
          email,
          rollNumber: roll || 'N/A',
          program: 'B.Tech Computer Science',
          term: 'Term 4 (Fall 2024)',
          cgpa: '0.00',
          createdAt: new Date().toISOString()
        });
        window.location.href = 'index.html';
      } catch (err) {
        hideLoading();
        showError(friendlyError(err.code));
      }
    });

    // Google Sign-In
    document.getElementById('googleSignInBtn').addEventListener('click', async () => {
      hideError();
      showLoading('Opening Google Sign-In...');
      try {
        const result = await signInWithPopup(auth, googleProvider);
        const user = result.user;
        // Save profile if first time
        await setDoc(doc(db, 'students', user.uid), {
          name: user.displayName || 'Student',
          email: user.email,
          rollNumber: 'N/A',
          program: 'B.Tech Computer Science',
          term: 'Term 4 (Fall 2024)',
          cgpa: '0.00',
          createdAt: new Date().toISOString()
        }, { merge: true });
        window.location.href = 'index.html';
      } catch (err) {
        hideLoading();
        showError(friendlyError(err.code));
      }
    });
  </script>

</body>
</html>
